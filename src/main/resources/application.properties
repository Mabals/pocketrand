server.port=${PORT:8080}

spring.application.name=pocketrand

# Database connection
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pocketrand}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
pocketrand.jwt.secret=${JWT_SECRET}
pocketrand.jwt.expiry-hours=24

# File uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Gemini AI
pocketrand.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
pocketrand.gemini.model=gemini-3.5-flash-lite
pocketrand.gemini.api-key=${GEMINI_API_KEY:}

# SARS tax tables: 2027 tax year (1 March 2026 - 28 February 2027)
pocketrand.tax.tax-year=2027
